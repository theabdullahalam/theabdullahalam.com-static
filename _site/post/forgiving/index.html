            <div class="main-content">
                <p>You grew up<br>
not knowing<br>
Not every flower<br>
is plucked in bloom.</p>
<p>Never knowing love,<br>
You'd wilt out of fear<br>
from afar.</p>
<p>So<br>
stop hiding your<br>
secret love for gloom;</p>
<p>For the world<br>
is just as forgiving<br>
as you are.</p>
<p><em>-Abdullah Alam</em></p>
